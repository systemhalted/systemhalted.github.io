name: Accessibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  axe:
    name: axe accessibility audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.9'
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Serve Jekyll site
        run: |
          bundle exec jekyll serve --skip-initial-build --no-watch --port 4002 --detach
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:4002/ > /dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Run Axe audit
        run: npm run a11y:json

      - name: Upload Axe output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: axe-output
          path: |
            a11y-results.json
          if-no-files-found: ignore
