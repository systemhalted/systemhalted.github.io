name: Accessibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  axe:
    name: axe accessibility audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Emacs 31.1
        uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7
        with:
          version: '31.1'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Check clean CI publishing contract
        run: test/ci-contract.sh

      - name: Build and validate Org site
        run: >-
          emacs -Q --batch -L publish
          -l publish/systemhalted-workflow.el
          -f systemhalted-batch-build

      - name: Check EWW rendering
        run: emacs -Q --batch --script scripts/test-eww-rendering.el _site/index.html

      - name: Serve generated site
        run: |
          emacs -Q --batch -L publish -l publish/systemhalted-workflow.el \
            --eval '(setq systemhalted-output-directory (expand-file-name "_site"))' \
            --eval '(setq systemhalted-preview-port 4002)' \
            --eval '(systemhalted-start-preview-server)' \
            --eval '(while t (accept-process-output nil 1))' \
            > /tmp/systemhalted-preview.log 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:4002/ > /dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Run browser interaction smoke checks
        run: npm run smoke

      - name: Run Axe audit
        run: npm run a11y:json

      - name: Upload Axe output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: axe-output
          path: |
            a11y-results.json
          if-no-files-found: ignore
