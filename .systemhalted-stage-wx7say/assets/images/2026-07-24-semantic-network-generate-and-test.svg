<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 930" width="900" height="930">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/></marker></defs>
<rect width="900" height="930" fill="#ffffff"/>
<text x="40" y="44" font-size="22" text-anchor="start" fill="#1c1c1c" font-weight="700" font-style="" font-family="Helvetica,Arial,sans-serif">Generate and Test</text>
<text x="40" y="66" font-size="13" text-anchor="start" fill="#6b6b6b" font-weight="400" font-style="" font-family="Helvetica,Arial,sans-serif">Control cycle and the state transitions it produces</text>
<line x1="40" y1="80" x2="860" y2="80" stroke="#dddddd" stroke-width="1"/>
<text x="40" y="112" font-size="14" text-anchor="start" fill="#1c1c1c" font-weight="700" font-style="" font-family="Helvetica,Arial,sans-serif">A.  The control cycle</text>
<rect x="40" y="140" width="120" height="44" rx="22" fill="none" stroke="#3a3a3a" stroke-width="1.6"/>
<text x="100" y="167" font-size="13" text-anchor="middle" fill="#1c1c1c" font-weight="400" font-style="" font-family="Helvetica,Arial,sans-serif">Start</text>
<rect x="230" y="136" width="180" height="52" rx="6" fill="none" stroke="#3a3a3a" stroke-width="1.6"/>
<text x="320" y="160" font-size="13" text-anchor="middle" fill="#1f5f8b" font-weight="700" font-style="" font-family="Helvetica,Arial,sans-serif">GENERATE</text>
<text x="320" y="178" font-size="11" text-anchor="middle" fill="#6b6b6b" font-weight="400" font-style="" font-family="Helvetica,Arial,sans-serif">produce next state</text>
<rect x="520" y="136" width="180" height="52" rx="6" fill="none" stroke="#3a3a3a" stroke-width="1.6"/>
<text x="610" y="160" font-size="13" text-anchor="middle" fill="#1f5f8b" font-weight="700" font-style="" font-family="Helvetica,Arial,sans-serif">TEST</text>
<text x="610" y="178" font-size="11" text-anchor="middle" fill="#6b6b6b" font-weight="400" font-style="" font-family="Helvetica,Arial,sans-serif">is it the goal?</text>
