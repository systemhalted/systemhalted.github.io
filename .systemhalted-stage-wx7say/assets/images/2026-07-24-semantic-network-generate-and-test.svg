<text x="675" y="297" font-size="13" text-anchor="middle" fill="#1e7a4b" font-weight="700" font-style="" font-family="Helvetica,Arial,sans-serif">Success</text>
<rect x="80" y="270" width="150" height="44" rx="22" fill="none" stroke="#a83232" stroke-width="1.6"/>
<text x="155" y="297" font-size="13" text-anchor="middle" fill="#a83232" font-weight="700" font-style="" font-family="Helvetica,Arial,sans-serif">Failure</text>
<line x1="160" y1="162" x2="228" y2="162" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="410" y1="162" x2="518" y2="162" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="464" y="152" font-size="10" text-anchor="middle" fill="#6b6b6b" font-weight="400" font-style="" font-family="Helvetica,Arial,sans-serif">candidate</text>
