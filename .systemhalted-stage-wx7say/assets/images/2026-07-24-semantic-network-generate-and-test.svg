<text x="40" y="884" font-size="12" text-anchor="start" fill="#6b6b6b" font-weight="400" font-style="" font-family="Helvetica,Arial,sans-serif">Each arrow is one generate step. Each label under a state is one test step.</text>
<text x="40" y="904" font-size="12" text-anchor="start" fill="#6b6b6b" font-weight="400" font-style="" font-family="Helvetica,Arial,sans-serif">Pure generate and test keeps no other information: a rejected state is dropped and the cycle repeats.</text>
