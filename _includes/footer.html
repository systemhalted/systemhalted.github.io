<footer class="site-footer">
  <div class="container footer-inner">
    <span>© {{ 'now' | date: '%Y' }} {{ site.author.name }}</span>
    <nav class="footer-links" aria-label="Footer navigation">
      <a href="https://palakmathur.in" rel="me">palakmathur.in</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      {% if site.author.linkedin %}<a href="{{ site.author.linkedin }}" rel="me noopener">LinkedIn</a>{% endif %}
      {% if site.author.email %}<a href="mailto:{{ site.author.email }}">Email</a>{% endif %}
    </nav>
  </div>
</footer>
