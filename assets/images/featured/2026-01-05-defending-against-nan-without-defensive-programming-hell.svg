<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="flow-title flow-description">
  <title id="flow-title">Check inputs and results</title>
  <desc id="flow-description">A method receives inputs, checks its input requirements, performs a calculation, checks its output requirements, and returns the value. An input check or a result check that fails leads to the same report-failure outcome. Finiteness is one possible requirement, not a guarantee that a value is acceptable.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#426782"/>
    </marker>
    <marker id="failure-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#96601c"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <rect x="72" y="65" width="8" height="65" rx="4" fill="#225f8f"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="105" y="115" fill="#14243a" font-size="60" font-weight="700">Check inputs and results</text>
    <text x="105" y="169" fill="#45566c" font-size="28">Use the method's input and output requirements.</text>

    <!-- The accepted path follows steps 1 through 5. -->
    <g fill="none" stroke="#426782" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
      <path d="M 490 340 H 584"/>
      <path d="M 1010 340 H 1104"/>
      <path d="M 1320 430 V 559"/>
      <path d="M 1110 655 H 1016"/>
    </g>
    <g fill="#334f68" font-size="24" font-weight="600" text-anchor="middle">
      <text x="540" y="318">Input</text>
      <text x="1060" y="318">Pass</text>
      <text x="1388" y="502">Result</text>
      <text x="1060" y="633">Pass</text>
    </g>

    <!-- Either check can use the method's defined failure response. -->
    <g fill="none" stroke="#96601c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#failure-arrow)">
      <path d="M 800 430 V 495 H 280 V 559"/>
      <path d="M 1320 745 V 803 H 280 V 751"/>
    </g>
    <g fill="#805015" font-size="24" font-weight="600" text-anchor="middle">
      <text x="548" y="481">Fail</text>
      <text x="800" y="789">Fail</text>
    </g>

    <!-- Step 1: incoming values. -->
    <g>
      <rect x="70" y="250" width="420" height="180" rx="18" fill="#ffffff" stroke="#bdcddd" stroke-width="2"/>
      <text x="100" y="286" fill="#566a80" font-size="20" font-weight="700">1</text>
      <text x="280" y="338" fill="#14243a" font-size="36" font-weight="700" text-anchor="middle">Receive inputs</text>
      <text x="280" y="380" fill="#45566c" font-size="25" text-anchor="middle">Values supplied to the method</text>
    </g>

    <!-- Step 2: requirements for accepted inputs. -->
    <g>
      <rect x="590" y="250" width="420" height="180" rx="18" fill="#e9f2fc" stroke="#225f8f" stroke-width="2.5"/>
      <text x="620" y="286" fill="#225f8f" font-size="20" font-weight="700">2</text>
      <text x="800" y="338" fill="#14243a" font-size="36" font-weight="700" text-anchor="middle">Check inputs</text>
      <text x="800" y="380" fill="#334f68" font-size="25" text-anchor="middle">Apply input requirements</text>
    </g>

    <!-- Step 3: the operation can create an unacceptable result. -->
    <g>
      <rect x="1110" y="250" width="420" height="180" rx="18" fill="#ffffff" stroke="#bdcddd" stroke-width="2"/>
      <text x="1140" y="286" fill="#566a80" font-size="20" font-weight="700">3</text>
      <text x="1320" y="338" fill="#14243a" font-size="36" font-weight="700" text-anchor="middle">Calculate</text>
      <text x="1320" y="380" fill="#45566c" font-size="25" text-anchor="middle">Perform the operation</text>
    </g>

    <!-- Step 4: establish the promised output conditions. -->
    <g>
      <rect x="1110" y="565" width="420" height="180" rx="18" fill="#e9f2fc" stroke="#225f8f" stroke-width="2.5"/>
      <text x="1140" y="601" fill="#225f8f" font-size="20" font-weight="700">4</text>
      <text x="1320" y="653" fill="#14243a" font-size="36" font-weight="700" text-anchor="middle">Check result</text>
      <text x="1320" y="695" fill="#334f68" font-size="25" text-anchor="middle">Apply output requirements</text>
    </g>

    <!-- Step 5: return a result that meets those conditions. -->
    <g>
      <rect x="590" y="565" width="420" height="180" rx="18" fill="#e7f4ec" stroke="#357a58" stroke-width="2.5"/>
      <text x="620" y="601" fill="#296044" font-size="20" font-weight="700">5</text>
      <text x="800" y="653" fill="#163c2a" font-size="36" font-weight="700" text-anchor="middle">Return value</text>
      <text x="800" y="695" fill="#2c5941" font-size="25" text-anchor="middle">Output requirements met</text>
    </g>

    <!-- Failure handling is an explicit part of the method's contract. -->
    <g>
      <rect x="70" y="565" width="420" height="180" rx="18" fill="#fff2df" stroke="#a46414" stroke-width="2.5"/>
      <text x="280" y="647" fill="#633d0f" font-size="36" font-weight="700" text-anchor="middle">Report failure</text>
      <text x="280" y="689" fill="#754b16" font-size="23" text-anchor="middle">Use the defined failure response</text>
    </g>

    <line x1="72" y1="841" x2="1528" y2="841" stroke="#d4dfe9" stroke-width="2"/>
    <text x="72" y="878" fill="#45566c" font-size="24">Floating Point Without Tears · Part 6</text>
  </g>
</svg>
